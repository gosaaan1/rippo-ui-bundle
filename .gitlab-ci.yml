stages:
  - verify
  - build
  - pages

variables:
  BUNDLE_FILE: "build/ui-bundle.zip"

# -------------------------
# 1) Verify (runs on branches + MRs + tags)
# -------------------------
lint:
  stage: verify
  image: node:20
  script:
    - npm ci
    - npx gulp lint

# -------------------------
# 2) Build UI bundle (runs on branches + tags)
# -------------------------
bundle:
  stage: build
  image: node:20
  script:
    - npm ci
    - npx gulp bundle
    - test -f "$BUNDLE_FILE"
  artifacts:
    expire_in: 7 days
    paths:
      - build/ui-bundle.zip

# -------------------------
# 3) Publish bundle to GitLab Pages (PUBLIC download, no auth)
#    - on default branch => publishes latest ui-bundle.zip
#    - on tags => publishes versioned bundle under /releases/<tag>/
# -------------------------
pages:
  stage: pages
  image: alpine:3.20
  needs: ["bundle"]
  before_script:
    - apk add --no-cache bash
  script:
    - mkdir -p public/releases
    # publish "latest" always (for branch pipelines)
    - cp -f build/ui-bundle.zip public/ui-bundle.zip
    # if tag pipeline => also publish versioned path
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        mkdir -p "public/releases/${CI_COMMIT_TAG}"
        cp -f build/ui-bundle.zip "public/releases/${CI_COMMIT_TAG}/ui-bundle.zip"
      fi
  artifacts:
    paths:
      - public
  rules:
    # run on default branch (master/main) and on tags
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never