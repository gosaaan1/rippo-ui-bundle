stages: [verify, build, release]

variables:
  PACKAGE_NAME: "antora-ui"
  BUNDLE_FILE: "build/ui-bundle.zip"

# -------------------------
# 1) Verify (runs on pushes/MRs)
# -------------------------
lint:
  stage: verify
  image: node:20
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - npm ci
    - npx gulp lint

# Optional: build bundle on non-tag commits just to test bundling works.
# (Useful during development; artifacts expire quickly.)
bundle_dev_artifact:
  stage: build
  image: node:20
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - npm ci
    - npx gulp bundle
    - test -f "$BUNDLE_FILE"
  artifacts:
    expire_in: 1 day
    paths:
      - build/ui-bundle.zip

# -------------------------
# 2) Release (runs ONLY on tags)
# -------------------------
build_ui_bundle:
  stage: build
  image: node:20
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci
    - npx gulp bundle
    - test -f "$BUNDLE_FILE"
  artifacts:
    paths:
      - build/ui-bundle.zip
    expire_in: 1 week

release_ui_bundle:
  stage: release
  image: alpine:3.20
  needs: ["build_ui_bundle"]
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Uploading $BUNDLE_FILE to Generic Package Registry..."
    - >
      curl --fail --location
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "$BUNDLE_FILE"
      "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$CI_COMMIT_TAG/ui-bundle.zip"
    - echo "Upload complete."
    - echo "Bundle URL:"
    - echo "https://gitlab.com/$CI_PROJECT_PATH/-/packages/generic/$PACKAGE_NAME/$CI_COMMIT_TAG/ui-bundle.zip"