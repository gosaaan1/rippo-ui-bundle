stages: [verify, build, release]

variables:
  BUNDLE_FILE: "build/ui-bundle.zip"

# -------------------------
# 1) Verify (runs on pushes/MRs)
# -------------------------
lint:
  stage: verify
  image: node:20
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - npm ci
    - npx gulp lint

bundle_dev_artifact:
  stage: build
  image: node:20
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - npm ci
    - npx gulp bundle
    - test -f "$BUNDLE_FILE"
  artifacts:
    expire_in: 1 day
    paths:
      - build/ui-bundle.zip

# -------------------------
# 2) Release (runs ONLY on tags)
# -------------------------
build_ui_bundle:
  stage: build
  image: node:20
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci
    - npx gulp bundle
    - test -f "$BUNDLE_FILE"
  artifacts:
    paths:
      - build/ui-bundle.zip
    expire_in: 1 week

release_ui_bundle:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build_ui_bundle"]
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl jq
    - test -n "$GITLAB_TOKEN" || (echo "ERROR: Missing GITLAB_TOKEN CI variable" && exit 1)
  script:
    # 1) Upload ui-bundle.zip to GitLab project uploads (public URL for public projects)
    - echo "Uploading UI bundle to GitLab uploads..."
    - |
      UPLOAD_JSON=$(curl --fail --silent \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --form "file=@${BUNDLE_FILE}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/uploads")
      echo "$UPLOAD_JSON" | jq .

    - UPLOAD_URL=$(echo "$UPLOAD_JSON" | jq -r '.url')
    - DOWNLOAD_URL="${CI_PROJECT_URL}${UPLOAD_URL}"
    - echo "DOWNLOAD_URL=$DOWNLOAD_URL"

    # 2) Create/Update Release and attach asset link
    - echo "Creating GitLab Release for tag ${CI_COMMIT_TAG}..."
  release:
    tag_name: $CI_COMMIT_TAG
    name: "UI Bundle $CI_COMMIT_TAG"
    description: "Antora UI bundle built from tag $CI_COMMIT_TAG"
    assets:
      links:
        - name: "ui-bundle.zip"
          url: $DOWNLOAD_URL