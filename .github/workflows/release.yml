name: Publish UI Bundle
on:
  push:
    branches: [main, integrate-asciidoctor-tabs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build UI bundle
        run: npx gulp bundle
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest UI Bundle
          body: |
            最新の main ブランチから自動ビルドされた Antora UI バンドル。

            Antora playbook からは以下の URL で参照できる:
            ```
            https://github.com/gosaaan1/rippo-ui-bundle/releases/download/latest/ui-bundle.zip
            ```
          prerelease: true
          files: build/ui-bundle.zip
